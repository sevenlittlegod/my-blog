name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Open PostgreSQL SSH tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -fN -L 5433:127.0.0.1:5432 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run build

      - run: npm run package:standalone

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy-bundle
          mkdir -p deploy-bundle
          cp -a .next/standalone/. deploy-bundle/
          cp ecosystem.config.js deploy-bundle/ecosystem.config.js
          echo "${GITHUB_SHA}" > deploy-bundle/.deploy_revision
          test -f deploy-bundle/server.js
          test -d deploy-bundle/.next/static
          ls -la deploy-bundle | sed -n '1,40p'

      - uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete --exclude='.env'"
          SOURCE: "deploy-bundle/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ secrets.SSH_TARGET }}

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.SSH_TARGET }}
            echo "deployed revision: $(cat .deploy_revision 2>/dev/null || echo missing)"
            echo "deploy directory: $(pwd)"
            test -f server.js
            test -d .next/static
            pm2 delete my-blog || true
            pm2 start ecosystem.config.js --update-env
            pm2 save
            pm2 list
            pm2 describe my-blog
            sleep 3
            node --input-type=module - <<'NODE'
            const assert = async (path, expectedStatus, expectedText) => {
              const response = await fetch(`http://127.0.0.1:3000${path}`, {
                redirect: "manual",
              });
              const body = await response.text();
              console.log(`${path} -> ${response.status}`);
              if (response.status !== expectedStatus) {
                throw new Error(`${path} returned ${response.status}, expected ${expectedStatus}`);
              }
              if (expectedText && !body.includes(expectedText)) {
                throw new Error(`${path} did not include ${expectedText}`);
              }
            };

            await assert("/", 200, "林葛由");
            await assert("/admin/login", 200, "林葛由");
            NODE
